{# Script du guide, partagé par la version française et la version anglaise (textes traduits par tx() de lois.js) #}
<script>
$("#choose").innerHTML=chooseRows();
document.querySelectorAll(".tx").forEach(e=>katex.render(e.dataset.t,e,{throwOnError:false}));
const NORM=LAWS[7];

/* Progression : étape active + ligne qui se remplit */
(function(){
  const links=[...document.querySelectorAll("#stepper a")],secs=links.map(a=>document.querySelector(a.hash));
  function upd(){
    const y=innerHeight*.35;let k=0;
    secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<y)k=i});
    links.forEach((a,i)=>{a.classList.toggle("on",i===k);a.classList.toggle("done",i<k)});
    const f=$("#fill"),st=$("#stepper");f.style.height=(links[k].offsetTop+16-16)+"px";
  }
  addEventListener("scroll",upd,{passive:true});upd();
})();

/* Démo 1 : aire sous la courbe */
(function(){
  const c=$("#demoArea"),x=c.getContext("2d");
  function draw(){
    const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);
    const W=r.width,H=r.height,a=num($("#da").value),b=num($("#db").value),v=num($("#ds").value);
    if(!(Number.isFinite(a)&&Number.isFinite(b)&&v>0&&v<=100)){$("#dP").textContent="—";return}
    const p=[0,v],s=Math.sqrt(v),x0=-4*s,x1=4*s,ym=NORM.f(0,p)*1.12,sx=t=>14+(t-x0)/(x1-x0)*(W-28),sy=y=>H-22-y/ym*(H-34);
    x.clearRect(0,0,W,H);
    const lo=Math.max(Math.min(a,b),x0),hi=Math.min(Math.max(a,b),x1);
    if(hi>lo){x.beginPath();x.moveTo(sx(lo),sy(0));for(let i=0;i<=120;i++){const t=lo+(hi-lo)*i/120;x.lineTo(sx(t),sy(NORM.f(t,p)))}x.lineTo(sx(hi),sy(0));x.closePath();
      const g=x.createLinearGradient(sx(lo),0,sx(hi),0);g.addColorStop(0,`rgba(${cssv("--a1-rgb")},.35)`);g.addColorStop(1,`rgba(${cssv("--a2-rgb")},.35)`);x.fillStyle=g;x.fill()}
    x.strokeStyle="rgba(10,15,30,.45)";x.lineWidth=1;x.beginPath();x.moveTo(14,H-22);x.lineTo(W-14,H-22);x.stroke();
    x.strokeStyle=cssv("--a1");x.lineWidth=2.6;x.beginPath();for(let i=0;i<=300;i++){const t=x0+(x1-x0)*i/300;i?x.lineTo(sx(t),sy(NORM.f(t,p))):x.moveTo(sx(t),sy(NORM.f(t,p)))}x.stroke();
    x.fillStyle="#6b7385";x.font="11px 'JetBrains Mono',monospace";x.textAlign="center";[x0,x0/2,0,x1/2,x1].forEach(t=>x.fillText(fmt(t,2),sx(t),H-6));
    $("#dP").textContent=fmt(NORM.F(Math.max(a,b),p)-NORM.F(Math.min(a,b),p),4);$("#dM").textContent=fmt(NORM.f(0,p),3);
  }
  ["#da","#db","#ds"].forEach(s=>$(s).addEventListener("input",draw));
  addEventListener("resize",draw);addEventListener("themechange",draw);document.fonts.ready.then(draw);draw();
})();

/* Démo 2 : dispersion des estimations selon n */
(function(){
  const c=$("#demoSpread"),x=c.getContext("2d");let pts=[],t0=0,n=10;
  function run(k){
    n=k;document.querySelectorAll("[data-n]").forEach(b=>b.classList.toggle("on",+b.dataset.n===n));
    pts=Array.from({length:60},()=>{let s=0;for(let i=0;i<n;i++)s+=randn();return{m:s/n,j:Math.random()}});
    const sd=Math.sqrt(pts.reduce((a,p)=>a+p.m*p.m,0)/pts.length);
    $("#dS").textContent=fmt(sd,3);$("#dS2").textContent=`   (${tx("théorie :")} 1/√n = ${fmt(1/Math.sqrt(n),3)})`;
    t0=performance.now();requestAnimationFrame(draw);
  }
  function draw(now){
    const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);
    const W=r.width,H=r.height,sx=v=>W/2+v/1.2*(W/2-20),base=H-30;
    x.clearRect(0,0,W,H);
    x.strokeStyle="rgba(10,15,30,.45)";x.lineWidth=1;x.beginPath();x.moveTo(14,base);x.lineTo(W-14,base);x.stroke();
    x.setLineDash([4,4]);x.beginPath();x.moveTo(sx(0),12);x.lineTo(sx(0),base);x.stroke();x.setLineDash([]);
    x.fillStyle="#6b7385";x.font="11px 'JetBrains Mono',monospace";x.textAlign="center";[-1,-.5,0,.5,1].forEach(v=>x.fillText(fmt(v,1),sx(v),H-10));x.fillText(tx("vrai μ = 0"),sx(0),10);
    let busy=false;
    pts.forEach((p,i)=>{const k=Math.min(1,Math.max(0,((now||t0)-t0-i*12)/380));if(k<1)busy=true;
      const y=20+(base-30)*(.15+.8*p.j)*k;x.globalAlpha=k;x.fillStyle=i%2?cssv("--a1"):cssv("--a2");x.beginPath();x.arc(sx(Math.max(-1.2,Math.min(1.2,p.m))),y,4.5,0,7);x.fill()});
    x.globalAlpha=1;if(busy)requestAnimationFrame(draw);
  }
  document.querySelectorAll("[data-n]").forEach(b=>b.addEventListener("click",()=>run(+b.dataset.n)));
  addEventListener("resize",()=>draw(performance.now()+1e4));addEventListener("themechange",()=>draw(performance.now()+1e4));
  run(10);
})();
</script>
