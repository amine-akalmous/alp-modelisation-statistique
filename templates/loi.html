<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include "_meta.html" %}
<link rel="icon" href="/static/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="stylesheet" href="{{ asset('style.css') }}">
<script src="{{ asset('site.js') }}"></script>
</head>
<body>

{% include "_header.html" %}

<main>
  <div class="wrap">
    <nav class="switch" id="switch" aria-label="Changer de loi"></nav>
    <div class="ltitle" id="ltitle">
      <div>
        <div class="label" id="kind"></div>
        <h1 id="lawName"></h1>
        <div class="nt" id="nt"></div>
      </div>
    </div>
    <p class="lede" id="lede"></p>
  </div>

  <!-- Barre des trois modes : reste visible pendant le défilement -->
  <div class="lawbar" id="lawbar"><div class="wrap lb">
    <div class="lbname"><b id="lbName"></b><span id="lbNt"></span></div>
    <div class="tabs3" id="tabs" role="tablist">
      <button data-t="props" class="on" role="tab"><b>01</b><span>Propriétés<small>formules et moments</small></span></button>
      <button data-t="sim" role="tab"><b>02</b><span>Simulation<small>tirer un échantillon</small></span></button>
      <button data-t="data" role="tab"><b>03</b><span>Application<small>vos propres données</small></span></button>
    </div>
  </div></div>

  <div class="wrap">
    <div id="view" class="view"></div>
  </div>
</main>

{% include "_footer.html" %}
<input type="file" id="file" accept=".txt,.csv,.dat,text/plain,text/csv" hidden>

<script>window.ALP_LAW = {{ slug|tojson }};</script>
<script src="{{ asset('lois.js') }}"></script>
<script src="{{ asset('loi.js') }}"></script>
</body>
</html>
